[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hr-agent-platform"
version = "0.1.0"
description = "基于 Python 的员工全生命周期人力资源 Agent 平台"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.18,<2.0",
    "celery[redis]>=5.6,<6.0",
    "cryptography>=46,<47",
    "fastapi>=0.115,<1.0",
    "langchain>=1.0,<2.0",
    "langchain-openai>=1.0,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic>=2.8,<3.0",
    "pwdlib[argon2]>=0.3,<1.0",
    "PyJWT>=2.10,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
